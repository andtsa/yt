[package]
name = "youtube-at-home"
version = "0.1.0"
edition = "2024"
description = "we have youtube at home: a local video library and watchlist manager on top of yt-dlp"

[[bin]]
name = "yt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
